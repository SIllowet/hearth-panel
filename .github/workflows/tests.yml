name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Hearth is a Windows program, but nothing under test shells out to Windows,
    # so it runs on both - Linux for speed, Windows for the path handling that
    # is the whole point of some of these tests.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Run the tests
        run: python -m pytest tests -q
      - name: Check the published checksums are current
        run: python tools/make_sums.py --check
